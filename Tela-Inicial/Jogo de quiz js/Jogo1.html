<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz | Cube Cat Jogos</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="Jogo1.css" />
  </head>
  <body>
    <div class="topbar">
      <a href="index.html" class="btn-voltar" id="quiz-back-link">&larr; Voltar aos quizzes</a>
      <a href="../index.html" class="topbar-logo" aria-label="Voltar para a página inicial"><img src="../../assets/logo.png" alt=""></a>
    </div>
    <div class="app">
      <h1 id="quiz-title">Quiz</h1>
      <div class="quiz">
        <p id="difficulty-badge" class="difficulty-badge" hidden></p>
        <div class="quiz-progress__header">
          <span id="question-counter">Pergunta 1 de 10</span>
        </div>
        <div id="question-progress" class="quiz-progress" role="progressbar" aria-label="Progresso das perguntas" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
        </div>
        <h2 id="question">A pergunta aparecerá aqui.</h2>
        <div id="answer-buttons">
          <button class="btn">Alternativa 1</button>
          <button class="btn">Alternativa 2</button>
          <button class="btn">Alternativa 3</button>
          <button class="btn">Alternativa 4</button>
        </div>
        <p id="answer-explanation" class="answer-explanation" hidden></p>
        <button id="next-btn">Próxima</button>
        <section id="quiz-result" class="quiz-result" aria-labelledby="score-summary" role="status" aria-live="polite" hidden>
          <p id="score-summary" class="score-summary"></p>
          <p id="score-points" class="score-points"></p>
          <p id="score-award" class="score-award"></p>
          <p id="perfect-run-status" class="perfect-run-status"></p>
          <p id="personal-record" class="personal-record"></p>
          <div class="session-history">
            <h3>Histórico desta sessão</h3>
            <ol id="attempt-history"></ol>
          </div>
          <div class="session-history saved-history">
            <h3>Histórico salvo neste dispositivo</h3>
            <ol id="saved-history"></ol>
          </div>
          <div class="quiz-result__actions">
            <button id="restart-quiz" type="button">Reiniciar</button>
            <a id="continue-harder" href="#" hidden></a>
            <a id="choose-topic" href="index.html">Escolher outro quiz</a>
          </div>
        </section>
      </div>
    </div>
    <script src="../Animacoes/quizzes.js"></script>
    <script src="../Universo/quizzes.js"></script>
    <script src="quiz-progress.js"></script>
    <script src="Jogo1.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/site-audio.js"></script>
</body>
</html>
